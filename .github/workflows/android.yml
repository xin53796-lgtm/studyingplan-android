name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Organize project files
        run: |
          mkdir -p www native
          for f in index.html manifest.json sw.js icon-192.png icon-512.png; do
            if [ -f "$f" ]; then mv "$f" www/; fi
          done
          for f in CalendarSync.java MainActivity.java; do
            if [ -f "$f" ]; then mv "$f" native/; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Prepare native project
        run: |
          pip install Pillow
          python prepare.py

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          umask 077
          KEYSTORE="$RUNNER_TEMP/studyplanner.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          mkdir -p output

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-type PKCS12 \
            --ks-key-alias studyplanner \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out output/studyplanner.apk \
            android/app/build/outputs/apk/debug/app-debug.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose output/studyplanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: study-planner-signed-apk
          path: output/studyplanner.apk
          if-no-files-found: error
